<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:Poppins;font-weight:500;src:url(assets/fonts/poppins-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:600;src:url(assets/fonts/poppins-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:700;src:url(assets/fonts/poppins-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:800;src:url(assets/fonts/poppins-latin-800-normal.woff2) format('woff2')}
html,body{margin:0;background:#f3f3f3} svg{display:block}
</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"></svg>
<script>
const NS='http://www.w3.org/2000/svg', s=document.getElementById('s');
const C={blue:'#4a4aa0',green:'#8cc978',yellow:'#e6b839',ink:'#23235a',white:'#fff',tYellow:'#7a5806',pGreen:'#e6f3df',tGreen:'#2f5a1f'};
const STITCH='#aeb0dc', FRAME_BG='#f5f5fa', CARD_LINE='#dcdcec';
const NB=' ';
function el(t,a={},p=s){const n=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))n.setAttribute(k,v);p.appendChild(n);return n}
function tx(p,x,y,str,{size=26,weight=500,fill=C.ink,anchor='start',ls=0}={}){const t=el('text',{x,y,'font-family':'Poppins','font-size':size,'font-weight':weight,fill,'text-anchor':anchor,'letter-spacing':ls},p);t.textContent=str;return t}
const errs=[]; const fit=(n,maxR,label,minL=0)=>{const b=n.getBBox(); if(b.x+b.width>maxR+.5||b.x<minL-.5) errs.push(label+' '+Math.round(b.x)+'→'+Math.round(b.x+b.width))};
const boxes=[]; const keep=(n,label)=>boxes.push([n,label]);

function build(){
  // Fond : papier, bandeau six couleurs
  el('rect',{x:0,y:0,width:1440,height:810,fill:'#f3f3f3'});
  el('image',{href:'assets/paper.png',x:0,y:0,width:1440,height:1800,preserveAspectRatio:'none'});
  ['#f16969','#75bec0','#aa76b2','#8cc978','#e0cf35','#74a3d6'].forEach((c,i)=>el('rect',{x:i*240,y:792,width:240,height:18,fill:c}));

  // Tête
  const t1=tx(s,60,138,'Les bases du Lean,',{size:88,weight:800,fill:C.blue}); fit(t1,980,'titre 1');
  const kb=el('rect',{x:42,y:166,height:98,rx:14,fill:C.blue});
  const t2=tx(s,70,238,'en une heure.',{size:88,weight:800,fill:C.white}); kb.setAttribute('width',t2.getBBox().width+56); fit(kb,980,'cadre');
  const ch=tx(s,62,320,'La White Belt Fichly, gratuite et à votre rythme.',{size:34,weight:500,fill:C.blue}); fit(ch,960,'chapeau');

  // Ceinture (en haut à droite)
  const g=el('g');
  const L=1010,R=1404, BT=150, th=52, sag=44, MX=(L+R)/2;
  const tail=(cx,cy,ang,len)=>{const t=el('g',{transform:`rotate(${ang} ${cx} ${cy})`},g);
    el('rect',{x:cx-24,y:cy,width:48,height:len,rx:6,fill:C.white,stroke:C.blue,'stroke-width':4},t);
    el('path',{d:`M ${cx-14} ${cy+10} V ${cy+len-10} M ${cx+14} ${cy+10} V ${cy+len-10}`,stroke:STITCH,'stroke-width':2.4,'stroke-dasharray':'8 6',fill:'none'},t);};
  const KX=MX, KY=BT+sag+th/2;
  tail(KX-10,KY+18,24,124); tail(KX+12,KY+18,-20,132);
  el('path',{d:`M ${L} ${BT} Q ${MX} ${BT+sag*2} ${R} ${BT} L ${R} ${BT+th} Q ${MX} ${BT+th+sag*2} ${L} ${BT+th} Z`,fill:C.white,stroke:C.blue,'stroke-width':4,'stroke-linejoin':'round'},g);
  el('path',{d:`M ${L+10} ${BT+11} Q ${MX} ${BT+11+sag*2} ${R-10} ${BT+11} M ${L+10} ${BT+th-11} Q ${MX} ${BT+th-11+sag*2} ${R-10} ${BT+th-11}`,stroke:STITCH,'stroke-width':2.4,'stroke-dasharray':'9 7',fill:'none'},g);
  el('path',{id:'mid',d:`M ${L} ${BT+th/2+7} Q ${MX} ${BT+th/2+7+sag*2} ${R} ${BT+th/2+7}`,fill:'none'},g);
  const tp=el('text',{'font-family':'Poppins','font-size':20,'font-weight':700,fill:C.blue,'letter-spacing':3},g);
  el('textPath',{href:'#mid',startOffset:'63%'},tp).textContent='WHITE BELT';
  const kn=el('g',{transform:`rotate(-5 ${KX} ${KY})`},g);
  el('rect',{x:KX-39,y:KY-41,width:78,height:82,rx:12,fill:C.white,stroke:C.blue,'stroke-width':4},kn);
  el('path',{d:`M ${KX-20} ${KY-31} V ${KY+31} M ${KX+20} ${KY-31} V ${KY+31}`,stroke:STITCH,'stroke-width':2.4,'stroke-dasharray':'8 6',fill:'none'},kn);
  // Sceau « Gratuite »
  const seal=(cx,cy,r)=>{const pts=[];const n=18;for(let i=0;i<n*2;i++){const a=Math.PI*i/n, rr=i%2?r*0.86:r;pts.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)])}
    el('path',{d:'M '+pts.map(p=>p.map(v=>v.toFixed(1)).join(' ')).join(' L ')+' Z',fill:C.yellow,stroke:C.tYellow,'stroke-width':2.5});
    const t=tx(s,cx,cy+10,'Gratuite',{size:27,weight:800,fill:C.white,anchor:'middle'}); t.setAttribute('transform',`rotate(-12 ${cx} ${cy})`);t.setAttribute('stroke',C.tYellow);t.setAttribute('stroke-width','4');t.setAttribute('paint-order','stroke');};
  seal(1036,300,68);

  // Carte du parcours
  el('rect',{x:42,y:366,width:1356,height:298,rx:24,fill:FRAME_BG,stroke:CARD_LINE,'stroke-width':2});
  const pg=el('g'); const pr=el('rect',{x:72,y:390,height:50,rx:25,fill:C.pGreen},pg);
  el('circle',{cx:101,cy:415,r:14,fill:C.green},pg);
  el('path',{d:'M 94.5 415.5 L 99 420 L 107.5 410.5',fill:'none',stroke:C.white,'stroke-width':3.6,'stroke-linecap':'round','stroke-linejoin':'round'},pg);
  const pt=tx(pg,128,424,'6 chapitres courts, un test, votre attestation',{size:25,weight:700,fill:C.tGreen}); pr.setAttribute('width',pt.getBBox().width+80);

  const RY=506, X0=96, X1=1352; el('path',{d:`M ${X0} ${RY} H ${X1}`,stroke:C.blue,'stroke-width':6,'stroke-linecap':'round'});
  const xs=[0,1,2,3,4,5,6,7].map(i=>136+i*166);
  const LABS=[['Le Lean,','c’est quoi'+NB+'?'],['La valeur','ajoutée'],['Les 8','gaspillages'],['Les 5S'],['Standard et','management','visuel'],['Résolution','de problème']];
  LABS.forEach((lab,i)=>{const x=xs[i];
    el('rect',{x:x-40,y:RY-29,width:80,height:58,rx:12,fill:C.blue});
    el('rect',{x:x-26,y:RY-38,width:18,height:11,rx:3,fill:C.blue}); el('rect',{x:x+8,y:RY-38,width:18,height:11,rx:3,fill:C.blue});
    tx(s,x,RY+12,String(i+1),{size:34,weight:800,fill:C.white,anchor:'middle'});
    lab.forEach((l,k)=>keep(tx(s,x,RY+70+k*28,l,{size:22,weight:700,fill:C.ink,anchor:'middle'}),'lab'+i+k));
  });
  const XT=xs[6]; el('rect',{x:XT-52,y:RY-29,width:104,height:58,rx:12,fill:C.yellow});
  tx(s,XT,RY+11,'Test',{size:29,weight:800,fill:C.ink,anchor:'middle'});
  keep(tx(s,XT,RY+70,'10 questions',{size:22,weight:700,fill:C.ink,anchor:'middle'}),'test');
  const XA=xs[7]; el('circle',{cx:XA,cy:RY,r:31,fill:C.green});
  el('path',{d:`M ${XA-14} ${RY+1} L ${XA-4} ${RY+11} L ${XA+15} ${RY-9}`,fill:'none',stroke:C.white,'stroke-width':6,'stroke-linecap':'round','stroke-linejoin':'round'});
  const ta=tx(s,XA,RY+70,'Attestation',{size:22,weight:700,fill:C.ink,anchor:'middle'}); keep(ta,'att_1'); fit(ta,1392,'attestation');
  keep(tx(s,XA,RY+98,'White Belt',{size:22,weight:700,fill:C.ink,anchor:'middle'}),'att_2');

  // Pied : appel + logo
  const ft=tx(s,62,756,'Votre attestation à partager sur LinkedIn',{size:30,weight:700,fill:C.blue});
  const fb=ft.getBBox(); el('path',{d:`M ${fb.x+24} 772 C ${fb.x+140} 764, ${fb.x+fb.width-140} 762, ${fb.x+fb.width-6} 764`,fill:'none',stroke:C.green,'stroke-width':3.6,'stroke-linecap':'round'});
  el('image',{href:'assets/fichly-logo.png',x:1220,y:698,width:170,height:90});

  // Chevauchements entre libellés voisins
  for(let i=0;i<boxes.length;i++)for(let j=i+1;j<boxes.length;j++){if(boxes[i][1].slice(0,4)===boxes[j][1].slice(0,4))continue;const A=boxes[i][0].getBBox(),B=boxes[j][0].getBBox();
    if(A.x<B.x+B.width+12&&B.x<A.x+A.width+12&&A.y<B.y+B.height&&B.y<A.y+A.height) errs.push('chevauchement '+boxes[i][1]+'/'+boxes[j][1]);}
  window.ERRS=errs; document.title='ready';
}
Promise.all(['500','600','700','800'].map(w=>document.fonts.load(`${w} 40px Poppins`))).then(build);
</script></body></html>
