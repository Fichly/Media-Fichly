<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="public/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: Poppins; font-weight: 500; src: url(public/fonts/poppins-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family: Poppins; font-weight: 600; src: url(public/fonts/poppins-latin-600-normal.woff2) format("woff2"); }
      @font-face { font-family: Poppins; font-weight: 700; src: url(public/fonts/poppins-latin-700-normal.woff2) format("woff2"); }
      @font-face { font-family: Poppins; font-weight: 800; src: url(public/fonts/poppins-latin-800-normal.woff2) format("woff2"); }
      :root {
        --blue: #4a4aa0; --ink: #23235a; --red: #f16969; --yellow: #e6b839; --violet: #aa76b2;
        --pRed: #fde6e6; --pYellow: #f8f3d9; --pLav: #ececf5; --line: #e2e2ee;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fbfaf6; }
      #root { position: relative; width: 1920px; height: 1080px; font-family: Poppins, sans-serif; color: var(--ink); }
      .ground {
        position: absolute; inset: 0;
        background-color: #fbfaf6;
        background-image: radial-gradient(circle, rgba(74, 74, 160, 0.13) 1.6px, transparent 1.8px);
        background-size: 40px 40px;
      }
      .ribbon { position: absolute; left: 0; bottom: 0; width: 1920px; height: 18px; display: flex; }
      .ribbon i { flex: 1; }
      .logo { position: absolute; right: 120px; top: 70px; width: 140px; }
      .t1 { position: absolute; left: 200px; top: 72px; line-height: 1; font-size: 84px; font-weight: 800; color: var(--blue); letter-spacing: -0.01em; }
      .band { position: absolute; left: 180px; top: 172px; height: 118px; width: 660px; border-radius: 16px; background: var(--blue); transform-origin: left center; }
      .t2 { position: absolute; left: 212px; top: 186px; line-height: 1; font-size: 84px; font-weight: 800; color: #fff; letter-spacing: -0.01em; }
      .row { position: absolute; left: 200px; height: 96px; }
      .bar {
        position: absolute; left: 0; top: 0; height: 96px; width: 1520px; border-radius: 14px;
        background: var(--blue); transform-origin: left center;
      }
      .lbl { position: absolute; left: 32px; top: 24px; font-size: 34px; font-weight: 600; color: #fff; white-space: nowrap; }
      .dur { position: absolute; top: 24px; font-size: 34px; font-weight: 700; color: #fff; text-align: right; width: 160px; font-variant-numeric: tabular-nums; }
      .loss {
        position: absolute; top: 0; left: 1330px; width: 190px; height: 96px; border-radius: 14px;
        background: var(--blue); border: 3px solid transparent;
        display: flex; align-items: center; justify-content: center;
      }
      .loss span { font-size: 26px; font-weight: 700; opacity: 0; }
      .formula { position: absolute; left: 200px; top: 908px; font-size: 46px; font-weight: 600; color: var(--ink); white-space: nowrap; opacity: 0; }
      .formula b { font-weight: 800; color: var(--blue); }
      .counter { display: inline-block; font-size: 64px; font-weight: 800; color: var(--blue); font-variant-numeric: tabular-nums; min-width: 230px; transform-origin: left 70%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1920" data-height="1080">
      <div id="ground" class="ground clip" data-start="0" data-duration="9" data-track-index="0"></div>

      <div id="scene" class="clip" data-start="0" data-duration="9" data-track-index="1">
        <img class="logo" src="public/fichly-logo.png" alt="Fichly" />
        <div class="t1" id="t1">Le TRS,</div>
        <div class="band" id="band"></div>
        <div class="t2" id="t2">en une image.</div>

        <div class="row" id="r1" style="top: 340px">
          <div class="bar"></div>
          <div class="lbl">Temps requis</div>
          <div class="dur" style="left: 1328px">8 h</div>
        </div>
        <div class="row" id="r2" style="top: 480px">
          <div class="bar"></div>
          <div class="loss" style="left: 1330px"><span style="color: #a83434">Arrêts</span></div>
          <div class="lbl">Temps de fonctionnement</div>
          <div class="dur" style="left: 1138px">7 h</div>
        </div>
        <div class="row" id="r3" style="top: 620px">
          <div class="bar"></div>
          <div class="loss" style="left: 1140px"><span style="color: #7a5806">Cadence</span></div>
          <div class="lbl">Temps net</div>
          <div class="dur" style="left: 948px">6 h</div>
        </div>
        <div class="row" id="r4" style="top: 760px">
          <div class="bar"></div>
          <div class="loss" style="left: 950px"><span style="color: #6b3f73">Rebuts</span></div>
          <div class="lbl">Temps utile</div>
          <div class="dur" style="left: 758px">5 h</div>
        </div>

        <div class="formula" id="formula">
          <b>TRS</b> = temps utile ÷ temps requis = <span class="counter" id="counter">0</span>
        </div>
      </div>

      <div id="ribbon" class="ribbon clip" data-start="0" data-duration="9" data-track-index="2">
        <i style="background: #f16969"></i><i style="background: #75bec0"></i><i style="background: #aa76b2"></i>
        <i style="background: #8cc978"></i><i style="background: #e0cf35"></i><i style="background: #74a3d6"></i>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const OUT = "expo.out", INOUT = "power3.inOut";

      // Titre : la première ligne monte, le bandeau s'ouvre de gauche à droite, la seconde ligne suit
      tl.from("#t1", { y: 40, opacity: 0, duration: 0.6, ease: OUT }, 0.1);
      tl.from("#band", { scaleX: 0, duration: 0.55, ease: INOUT }, 0.35);
      tl.from("#t2", { y: 24, opacity: 0, duration: 0.5, ease: OUT }, 0.6);

      // Ligne 1 : la barre du temps requis se trace
      tl.from("#r1 .bar", { scaleX: 0, duration: 0.8, ease: INOUT }, 1.0);
      tl.from("#r1 .lbl, #r1 .dur", { opacity: 0, x: -12, duration: 0.4, ease: OUT, stagger: 0.08 }, 1.55);

      // Lignes 2 à 4 : la ligne du dessus se duplique, descend, puis la perte se détache
      const losses = [
        ["#r2", 2.2, "#fde6e6", "#f16969", 1330],
        ["#r3", 3.7, "#f8f3d9", "#e6b839", 1140],
        ["#r4", 5.2, "#f3e8f5", "#aa76b2", 950],
      ];
      losses.forEach(([r, t, fill, stroke, keep], i) => {
        const prevW = keep + 190;
        tl.set(`${r} .bar`, { width: prevW }, 0);
        tl.from(r, { y: -140, opacity: 0, duration: 0.55, ease: INOUT }, t);
        tl.set(`${r} .loss`, { opacity: 1 }, t);
        // La perte change de nature : elle se colore et s'écarte
        tl.to(`${r} .loss`, { backgroundColor: fill, borderColor: stroke, x: 18, duration: 0.45, ease: OUT }, t + 0.6);
        tl.to(`${r} .loss span`, { opacity: 1, duration: 0.3 }, t + 0.75);
        tl.fromTo(`${r} .bar`, { width: prevW }, { width: keep, duration: 0.45, ease: OUT }, t + 0.6);
        tl.from(`${r} .lbl, ${r} .dur`, { opacity: 0, duration: 0.35, ease: OUT, stagger: 0.06 }, t + 0.7);
        // Les pertes déjà détachées tombent légèrement en retrait
        tl.to(`${r} .loss`, { opacity: 0.55, duration: 0.4 }, t + 1.4);
      });

      // Formule : le compteur monte jusqu'à 62,5 %
      const counter = document.getElementById("counter");
      const state = { v: 0 };
      tl.to("#formula", { opacity: 1, duration: 0.4, ease: OUT }, 6.7);
      tl.to(state, {
        v: 62.5, duration: 1.1, ease: "power2.out",
        onUpdate: () => { counter.textContent = state.v.toFixed(1).replace(".", ",") + " %"; },
      }, 6.9);
      tl.fromTo("#counter", { scale: 0.7 }, { scale: 1, duration: 1.1, ease: "power2.out" }, 6.9);
      // Les deux barres de la formule ressortent
      tl.to("#r1 .bar, #r4 .bar", { boxShadow: "0 0 0 6px rgba(230,184,57,0.9)", duration: 0.35, yoyo: true, repeat: 1 }, 7.9);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
